name: Публикация страницы

# Ключ Arbiscan НЕ хранится в исходниках: он лежит в секретах репозитория
# (Settings -> Secrets and variables -> Actions -> ARBISCAN_KEY) и подставляется
# в index.html только в момент сборки. В git он не попадает.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Подставить ключ Arbiscan
        env:
          KEY: ${{ secrets.ARBISCAN_KEY }}
        run: python3 .github/inject_key.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
